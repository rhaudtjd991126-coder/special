<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>특수학급 금융 & 키오스크 교육 웹앱</title>
  <!-- Tailwind CSS CDN (쉬운 스타일링 및 모바일 최적화) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    /* 특수학급 학생을 위한 터치 영역 확장 */
    .touch-btn { min-height: 52px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- 1. 상단 네비게이션 바 -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-building-columns text-2xl text-yellow-300"></i>
        <h1 class="font-bold text-lg tracking-tight">문일 에듀뱅크</h1>
      </div>
      <!-- 로그인 정보 및 로그아웃 버튼 (로그인 후 표시) -->
      <div id="userInfoHeader" class="hidden flex items-center space-x-3">
        <span id="userBadge" class="text-xs bg-indigo-800 text-yellow-300 font-bold px-2 py-1 rounded-full">학생</span>
        <span id="userNameDisplay" class="font-bold text-sm">홍길동</span>
        <button onclick="handleLogout()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-2 py-1 rounded border border-indigo-500">
          <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
        </button>
      </div>
    </div>
  </header>

  <!-- 2. 메인 컨테이너 (모바일 중심 가독성 레이아웃) -->
  <main class="max-w-md mx-auto w-full flex-1 p-4 flex flex-col justify-center">

    <!-- A. 로그인 / 회원가입 인증 화면 -->
    <section id="authSection" class="bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
      
      <!-- 탭 전환 버튼 -->
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-lg">
          로그인
        </button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 pb-3 text-center font-bold text-slate-400 text-lg">
          회원가입
        </button>
      </div>

      <!-- 로그인 폼 -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">학번 또는 ID</label>
          <input type="text" id="loginStudentId" required placeholder="예: 10101 또는 teacher1" 
                 class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">비밀번호 (숫자 4자리)</label>
          <input type="password" id="loginPassword" maxlength="4" pattern="[0-9]*" inputmode="numeric" required placeholder="****" 
                 class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg tracking-widest">
        </div>
        <button type="submit" id="loginSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg rounded-xl touch-btn shadow-md transition-all mt-2">
          로그인하기
        </button>
      </form>

      <!-- 회원가입 폼 (초기 숨김) -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">계정 구분</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer border-indigo-500 bg-indigo-50 font-bold text-indigo-700" id="roleStudentLabel">
              <input type="radio" name="regRole" value="student" checked onclick="selectRole('student')" class="sr-only">
              <i class="fa-solid fa-graduation-cap mr-2"></i> 학생
            </label>
            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer border-slate-200 text-slate-600" id="roleTeacherLabel">
              <input type="radio" name="regRole" value="teacher" onclick="selectRole('teacher')" class="sr-only">
              <i class="fa-solid fa-chalkboard-user mr-2"></i> 교사 (관리자)
            </label>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">학번 또는 ID</label>
          <input type="text" id="regStudentId" required placeholder="학생: 학번5자리 / 교사: ID입력" 
                 class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">이름</label>
          <input type="text" id="regName" required placeholder="성함을 입력하세요" 
                 class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">비밀번호 (숫자 4자리)</label>
          <input type="password" id="regPassword" maxlength="4" pattern="[0-9]*" inputmode="numeric" required placeholder="4자리 숫자" 
                 class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg tracking-widest">
        </div>
        <button type="submit" id="regSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-lg rounded-xl touch-btn shadow-md transition-all mt-2">
          회원가입 완료
        </button>
      </form>
    </section>

    <!-- B. 학생용 메인 뷰 (로그인 후 전환, 3단계에서 내부 기능 추가) -->
    <section id="studentMainView" class="hidden space-y-4">
      <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-5 text-center">
        <h2 class="text-xl font-bold text-indigo-900 mb-1">반갑습니다, <span id="studentViewName">학생</span>님!</h2>
        <p class="text-sm text-indigo-600">모바일 뱅킹 서비스에 오신 것을 환영합니다.</p>
      </div>
      <!-- 3단계에서 계좌, 이체, 내역 카드 삽입 구역 -->
      <div id="studentDashboardArea" class="bg-white p-6 rounded-2xl shadow border border-slate-200 text-center text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-indigo-500"></i>
        <p>계좌 정보를 불러오는 중입니다...</p>
      </div>
    </section>

    <!-- C. 교사용 메인 뷰 (학생 화면에서는 구조 자체가 완전히 숨겨짐) -->
    <section id="teacherMainView" class="hidden space-y-4">
      <div class="bg-purple-50 border border-purple-200 rounded-2xl p-5 text-center">
        <h2 class="text-xl font-bold text-purple-900 mb-1">교사 관리자 모드</h2>
        <p class="text-sm text-purple-600">학생 관리, 키오스크 매장 및 ATM 관리 센터입니다.</p>
      </div>
      <!-- 4~6단계에서 교사 전용 관리 탭 삽입 구역 -->
      <div id="teacherDashboardArea" class="bg-white p-6 rounded-2xl shadow border border-slate-200 text-center text-slate-400">
        <p>관리자 기능을 준비 중입니다.</p>
      </div>
    </section>

  </main>

  <!-- 3. 하단 카피라이트 -->
  <footer class="text-center py-4 text-xs text-slate-400">
    <p>© 2026 특수학급 실전 금융·키오스크 교육 시스템</p>
  </footer>

  <!-- 4. 자바스크립트 스크립트 연동 -->
  <script>
    // =================================================================
    // [설정] 1단계에서 구글 앱스크립트 배포 후 받은 웹앱 URL을 입력하세요.
    // =================================================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwrU6cqJkJHfyV4gRRKlMpXbONcfHvobT6aDrW7xAy1WAp9zqnA5oZRZW_9vSVyih5QkA/exec";

    // 현재 로그인된 사용자 정보 상태
    let currentUser = null;

    // --- 백엔드 API 통신 공통 함수 (fetch) ---
    async function callBackend(action, data = {}) {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("여기에_1단계")) {
        alert("구글 앱스크립트 웹앱 URL(GAS_WEB_APP_URL)이 설정되지 않았습니다. code.gs 배포 URL을 입력해 주세요.");
        throw new Error("GAS URL 미설정");
      }

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, data: data })
        });
        return await response.json();
      } catch (error) {
        console.error("통신 에러:", error);
        alert("서버 통신 중 오류가 발생했습니다. 네트워크 연결을 확인해 주세요.");
        return { success: false, message: "통신 오류" };
      }
    }

    // --- 탭 및 UI 전환 제어 ---
    function switchAuthTab(tab) {
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const tabLoginBtn = document.getElementById("tabLoginBtn");
      const tabRegisterBtn = document.getElementById("tabRegisterBtn");

      if (tab === 'login') {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
        tabLoginBtn.className = "flex-1 pb-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-lg";
        tabRegisterBtn.className = "flex-1 pb-3 text-center font-bold text-slate-400 text-lg";
      } else {
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");
        tabRegisterBtn.className = "flex-1 pb-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-lg";
        tabLoginBtn.className = "flex-1 pb-3 text-center font-bold text-slate-400 text-lg";
      }
    }

    function selectRole(role) {
      const studentLabel = document.getElementById("roleStudentLabel");
      const teacherLabel = document.getElementById("roleTeacherLabel");

      if (role === 'student') {
        studentLabel.className = "flex items-center justify-center p-3 border rounded-xl cursor-pointer border-indigo-500 bg-indigo-50 font-bold text-indigo-700";
        teacherLabel.className = "flex items-center justify-center p-3 border rounded-xl cursor-pointer border-slate-200 text-slate-600";
      } else {
        teacherLabel.className = "flex items-center justify-center p-3 border rounded-xl cursor-pointer border-indigo-500 bg-indigo-50 font-bold text-indigo-700";
        studentLabel.className = "flex items-center justify-center p-3 border rounded-xl cursor-pointer border-slate-200 text-slate-600";
      }
    }

    // --- 회원가입 처리 ---
    async function handleRegister(e) {
      e.preventDefault();
      const studentId = document.getElementById("regStudentId").value.trim();
      const name = document.getElementById("regName").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      const role = document.querySelector('input[name="regRole"]:checked').value;

      if (password.length !== 4 || isNaN(password)) {
        alert("비밀번호는 숫자 4자리로 입력해 주세요.");
        return;
      }

      const btn = document.getElementById("regSubmitBtn");
      btn.disabled = true;
      btn.innerText = "처리 중...";

      const res = await callBackend("register", {
        studentId: studentId,
        name: name,
        password: password,
        role: role
      });

      btn.disabled = false;
      btn.innerText = "회원가입 완료";

      if (res.success) {
        alert(res.message + " 바로 로그인해 주세요.");
        document.getElementById("registerForm").reset();
        switchAuthTab('login');
      } else {
        alert("회원가입 실패: " + res.message);
      }
    }

    // --- 로그인 처리 ---
    async function handleLogin(e) {
      e.preventDefault();
      const studentId = document.getElementById("loginStudentId").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      const btn = document.getElementById("loginSubmitBtn");
      btn.disabled = true;
      btn.innerText = "로그인 중...";

      const res = await callBackend("login", {
        studentId: studentId,
        password: password
      });

      btn.disabled = false;
      btn.innerText = "로그인하기";

      if (res.success) {
        currentUser = res.user;
        renderMainView();
      } else {
        alert("로그인 실패: " + res.message);
      }
    }

    // --- 로그인 성공 후 뷰 랜더링 ---
    function renderMainView() {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("userInfoHeader").classList.remove("hidden");
      document.getElementById("userNameDisplay").innerText = currentUser.name;

      const userBadge = document.getElementById("userBadge");

      if (currentUser.role === 'student') {
        userBadge.innerText = "학생";
        userBadge.className = "text-xs bg-indigo-800 text-yellow-300 font-bold px-2 py-1 rounded-full";
        document.getElementById("studentMainView").classList.remove("hidden");
        document.getElementById("teacherMainView").classList.add("hidden"); // 교사 UI 철저 차단
        document.getElementById("studentViewName").innerText = currentUser.name;
      } else {
        userBadge.innerText = "교사";
        userBadge.className = "text-xs bg-purple-800 text-white font-bold px-2 py-1 rounded-full";
        document.getElementById("teacherMainView").classList.remove("hidden");
        document.getElementById("studentMainView").classList.add("hidden");
      }
    }

    // --- 로그아웃 처리 ---
    function handleLogout() {
      currentUser = null;
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("studentMainView").classList.add("hidden");
      document.getElementById("teacherMainView").classList.add("hidden");
      document.getElementById("userInfoHeader").classList.add("hidden");
      document.getElementById("loginForm").reset();
    }
  </script>
</body>
</html>
